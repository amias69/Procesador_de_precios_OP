services:
  observatorio-precios:
    build: .
    container_name: observatorio-precios
    restart: unless-stopped

    environment:
      CATALOGO_PROXIES_FILE: /app/config/proxies.txt

    volumes:
      - ./config/proxies.txt:/app/config/proxies.txt:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s